server.port=8080

# Active profile: 'local' (H2 in MySQL mode for instant out-of-the-box run) or 'mysql' (Production MySQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# SafeUPI Application Config
safeupi.jwt.secret=${JWT_SECRET:SafeUPISecretKeyForJwtTokenGenerationAndValidation2026!}
safeupi.jwt.expiration-ms=86400000

# Jackson Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
